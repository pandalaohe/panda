rule-providers:
  Claude:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/pandalaohe/panda/260504/ruleset/local/proxy/Claude.list"
    path: ./ruleset/local/proxy/Claude.list
    interval: 86400

  OpenAI:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/pandalaohe/panda/260504/ruleset/local/proxy/OpenAI.list"
    path: ./ruleset/local/proxy/OpenAI.list
    interval: 86400

  ProxyPin:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/pandalaohe/panda/260504/ruleset/local/pin/ProxyPin.list"
    path: ./ruleset/local/pin/ProxyPin.list
    interval: 86400

  AI:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/pandalaohe/panda/260504/ruleset/local/proxy/AI.list"
    path: ./ruleset/local/proxy/AI.list
    interval: 86400

  IntlMedia_Priority:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/pandalaohe/panda/260504/ruleset/local/proxy/IntlMedia_Priority.list"
    path: ./ruleset/local/proxy/IntlMedia_Priority.list
