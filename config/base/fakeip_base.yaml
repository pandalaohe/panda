port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # Real-IP/direct bindings must win before proxy AI/Claude/OpenAI parents.
    - RULE-SET,FakeIP_Direct_RealIP,real-ip
    - RULE-SET,Claude,fake-ip
    - RULE-SET,OpenAI,fake-ip
    - RULE-SET,ProxyPin,fake-ip
    - RULE-SET,AI,fake-ip
    - RULE-SET,IntlMedia_Priority,fake-ip
    - RULE-SET,FakeIP_Filter_Wide,real-ip
    - GEOSITE,private,real-ip
    - GEOSITE,cn,real-ip
    - GEOSITE,apple-cn,real-ip
    - GEOSITE,microsoft@cn,real-ip
    - GEOSITE,steam@cn,real-ip
    - GEOSITE,category-games@cn,real-ip
    - GEOSITE,category-game-platforms-download@cn,real-ip
    - GEOSITE,category-public-tracker,real-ip
    - GEOSITE,openai,fake-ip
    - GEOSITE,anthropic,fake-ip
    - GEOSITE,category-ai-!cn,fake-ip
    - GEOSITE,category-ai-chat-!cn,fake-ip
    - MATCH,fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    domain:
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.githubusercontent.com"
      - "+.googlevideo.com"
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:FakeIP_Direct_RealIP":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:Claude":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "rule-set:OpenAI":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "rule-set:ProxyPin":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "rule-set:AI":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "rule-set:IntlMedia_Priority":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "geosite:private":
      - system
    "geosite:cn,apple-cn,microsoft@cn,steam@cn,category-games@cn,category-game-platforms-download@cn,category-public-tracker":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:openai,anthropic,category-ai-!cn,category-ai-chat-!cn":
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "+.b886.top":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "+.sssaicode.com":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "+.packyapi.com":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
    "+.clawto.link":
